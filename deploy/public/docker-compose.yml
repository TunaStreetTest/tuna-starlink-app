# Static Planet Hack television. PUBLIC_HOST is read from .env on the box, not from git.
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site
      - caddy_data:/data
      - caddy_config:/config

  xloops:
    build:
      context: ./x-loops
      dockerfile: deploy/public/Dockerfile
    image: xloops-public:local
    restart: unless-stopped
    env_file:
      - xloops.env
    volumes:
      - xloops_data:/data
      - ./xloops-secrets:/secrets:ro
    mem_limit: 256m
    expose:
      - "8780"

volumes:
  caddy_data:
  caddy_config:
  xloops_data:
