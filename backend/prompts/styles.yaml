# Planet Hack — digital series for @tunastarlink
# Cool-tech wire: SpaceX / GPU / AI model releases only.
# Visual north star: true hacker-movie matrix — dense neon code-rain architecture.

series:
  name: Planet Hack
  tagline: Cool tech from the wire, remixed as matrix CGI.
  shared_lock: >
    HARD RULES: 3D digital CGI only. Wide 16:9 landscape full-bleed frame.
    TRUE HACKER MATRIX energy: luminous code-rain, glyph streams, neon lattice,
    phosphor green + electric cyan + hot magenta on deep void black, high contrast.
    One clear hero PLUS dense supporting atmosphere (packet rivers, glyph sheets,
    rack-light, orbital data) — cinematic and layered, never empty black void,
    never scrapyard soup, never soft lifestyle tech ad.
    Push TECH VOLUME: silicon, fiber, rocket telemetry, GPU die light, neural mesh —
    the scene should feel like the mainframe is awake.
    No readable product logos, flags, photoreal people, or real city maps.
    NOT oil paint. NOT a corporate SaaS banner. NOT a lonely object in empty space.

default: data-tunnel

styles:
  planet-core:
    label: Planet Core
    hashtag: PlanetCore
    lane: space
    description: Planetary mainframe core — Starship-scale orbital compute, matrix Earth.
    art_director_notes: >
      SpaceX / orbital / Starlink story as metaphor only. INTERIOR of a planetary-scale
      computer core (not a lonely planet in black space). Hero: wireframe data-Earth OR
      glowing root node jacked into the core, with orbital data rings, Starlink-mesh light,
      volumetric god-rays, dense cyan-magenta-green glyph dust. Density: HIGH matrix —
      code-rain sheets in depth, not empty void. Mood: launch pressure, hacker climax.
      Camera: low-angle deep interior, wide FOV, 16:9 full-bleed.
    prompt_seed: >
      Wide 16:9 cinematic landscape, deep interior of a planetary-scale computer core,
      cracked holographic wireframe Earth as hero, layered orbital data rings with fractures,
      Starlink-mesh light veins, dense matrix code-rain and glyph sheets in volumetric fog,
      glowing root node and energy spike, electric cyan magenta and phosphor green on void black,
      ArtStation CGI cyberspace hacker-movie still, full-bleed horizontal — not empty void

  data-tunnel:
    label: Data Tunnel
    hashtag: DataTunnel
    lane: ai
    description: Speed tunnel — AI model weights / inference packets at light-speed.
    art_director_notes: >
      AI model release / LLM / inference story as metaphor. Strong tunnel axis, motion,
      far model-core glow. Conduit walls of geometric code and weight tensors — kinetic,
      saturated, dense matrix rain sliding along the walls. Mid-high density: streaks,
      glyph detail, horizon bloom. Palette: cyan dominant + magenta + acid-green sparks.
      Camera: extreme FOV vanishing point, 16:9 full-bleed.
    prompt_seed: >
      Wide 16:9 landscape, high-speed cyberspace data tunnel, strong vanishing point,
      luminous geometric conduit walls of matrix code and neural-weight lattice,
      cyan energy lines and magenta accents, phosphor-green packet rain, motion streaks,
      far AI model-core bloom, kinetic depth, volumetric haze, extreme FOV,
      hacker-movie CGI, full-bleed horizontal

  signal-cathedral:
    label: Signal Cathedral
    hashtag: SignalCathedral
    lane: space
    description: Signal megastructure — Starlink / RF cathedral of pure matrix light.
    art_director_notes: >
      Starlink / RF / space-comms story as metaphor. Wide cathedral interior of soaring
      signal beams and dish geometry, stained-glass neon made of glyph panes — dense
      matrix atmosphere, not empty air. Vertical architecture in a horizontal frame.
      Palette: void + cyan + magenta + soft gold + acid-green edge. Mood: transmission.
    prompt_seed: >
      Wide 16:9 landscape, colossal digital signal cathedral interior, soaring neon beams
      and parabolic dish geometry, volumetric cyan-magenta-gold light through glyph-stained
      glass, dense matrix code-rain in the nave, epic layered depth, full-bleed horizontal,
      hacker-movie CGI cyberspace

  rootkit-city:
    label: Rootkit City
    hashtag: RootkitCity
    lane: gpu
    description: Circuit metropolis — GPU die / datacenter skyline under infiltration.
    art_director_notes: >
      GPU / NVIDIA / silicon / datacenter story as metaphor. Circuit-board tower city at
      night as a giant GPU die skyline, ONE bright acid-green rewrite path. Dense grid
      glow, rack lights, matrix rain between towers — intentional city detail, not noise soup.
      Palette: acid-green path + dark cyan grid + magenta nodes + void. Mood: root access.
    prompt_seed: >
      Wide 16:9 landscape, circuit-board metropolis skyline like a colossal GPU die at night,
      clear tower silhouettes, bright acid-green infiltration path cutting the city,
      dark cyan grid and magenta signal nodes, dense matrix code-rain between towers,
      layered depth, readable cinematic digital city, hacker-movie CGI, full-bleed horizontal
