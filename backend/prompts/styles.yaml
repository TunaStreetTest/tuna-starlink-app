# Planet Hack — digital series for @tunastarlink
# Cool-tech wire: SpaceX / GPU / AI model releases only.
# Visual DNA: neon-night matrix CGI — cyan / magenta / acid-green color spectrum on void black.

series:
  name: Planet Hack
  tagline: Cool tech from the wire, remixed as matrix CGI.
  # Kept for style metadata / UI; compose path now leads with art-director SHOT paragraph.
  shared_lock: >
    Premium 3D digital CGI, wide 16:9 VFX still. Zero humans. One impossible non-human
    hero structure with photoreal materials and dual warm/cool light. Neon accents ok;
    no lightning paths, lava, logos, flags, or readable text.

default: data-tunnel

styles:
  data-space:
    label: Data Space
    hashtag: DataSpace
    lane: space
    description: Deep-space spatial view — planets, stars, SpaceX-inspired craft; varies per run.
    art_director_notes: >
      SpaceX / orbital / launch story as metaphor only. EXTERIOR deep-space shot
      (not a tunnel, not a city street). VARIETY IS REQUIRED — each run picks a different
      spatial setup (single planet, multi-planet system, star-forward, or geometric
      SpaceX-inspired starship as pure machine silhouette). Hero is NEVER a person —
      no pilots, no windows with faces, no little astronauts.
      SpaceX vibe = clean stainless / heat-tile geometry, stacked stages, grid fins as
      abstract shapes, plume/engine light — NO logos, NO real branding text.
      Atmosphere: holographic data-rings with cyan/magenta telemetry arcs, sparse orbital
      glints (a few satellites max — NEVER hundreds or a dense Starlink swarm), nebula fog.
      Camera: wide cinematic 16:9, epic scale, finished VFX still.
      Color: deep indigo void + soft gold limb light + ice-white stars, with electric cyan
      and magenta data overlays as real luminous color (not monochrome metal only).
    prompt_seed: >
      Wide 16:9 ultra-premium cinematic deep-space CGI (spatial exterior view),
      finished VFX still, vast scale and depth, volumetric nebula and sharp starfield,
      holographic cyan and magenta data rings and telemetry arcs (not readable text),
      soft gold planet-limb light, only a few distant orbital craft if any —
      never a dense satellite swarm, no people, no human silhouettes, no corporate logos

  planet-core:
    label: Planet Core
    hashtag: PlanetCore
    lane: space
    description: Planetary mainframe core — Starship-scale orbital compute, matrix Earth.
    art_director_notes: >
      SpaceX / orbital / Starlink story as metaphor only. INTERIOR of a planetary-scale
      computer core (not a lonely planet in black space). Hero: wireframe data-Earth OR
      glowing root node jacked into the core — NEVER a human figure. Orbital data rings,
      mesh light veins, volumetric god-rays, controlled glyph dust. Density mid-high.
      Palette: soft gold Earth-limb + electric cyan structure + magenta signal threads +
      acid-green root accents on deep indigo shadows — full neon spectrum, not monochrome.
      Mood: launch pressure. Camera: low-angle deep interior, wide FOV, 16:9 full-bleed.
    prompt_seed: >
      Wide 16:9 ultra-premium cinematic CGI, deep interior of a planetary-scale computer core,
      cracked holographic wireframe Earth as the only hero (no people), layered orbital data rings,
      cyan-magenta signal veins and gold limb light through data fog, acid-green root accents,
      volumetric god-rays, sharp metal-glass micro-detail, vast scale, finished VFX still,
      full-bleed horizontal — luminous neon spectrum night, not empty void, not monochrome

  data-tunnel:
    label: Data Tunnel
    hashtag: DataTunnel
    lane: ai
    description: Speed tunnel — vanishing-point conduit packed with flowing neon data.
    art_director_notes: >
      AI / infrastructure story as metaphor. Strong tunnel axis, motion, far glow.
      Geometric conduit walls with readable energy structure — kinetic and saturated,
      not sparse black pipe. HIGH density of DATA IN MOTION: packed packet streams,
      luminous torrents racing toward the vanishing point, layered side-channel flows,
      glowing glyph dust, debris particles — the tunnel should feel busy and alive.
      Palette: full neon spectrum — cyan walls, magenta accents, acid-green sparks on void black.
      Camera: extreme FOV vanishing point, 16:9 full-bleed. No people.
    prompt_seed: >
      Wide 16:9 landscape, high-speed cyberspace data tunnel, strong vanishing point,
      dense torrents of luminous data packets streaming through the conduit,
      walls of glowing pixel columns, layered cyan magenta acid-green energy flows,
      motion streaks, side-channel streams, far root-light bloom, kinetic depth,
      volumetric haze, extreme FOV, full-bleed horizontal — busy packed neon data traffic

  signal-cathedral:
    label: Signal Cathedral
    hashtag: SignalCathedral
    lane: space
    description: Signal megastructure — RF cathedral of engineered light and neon glass.
    art_director_notes: >
      Starlink / RF / space-comms story as metaphor. Colossal cathedral interior: soaring beams,
      dish geometry, stained-glass panels of pure signal (no people in pews, no priests).
      Dense atmosphere of light shafts, not empty air. Vertical architecture in horizontal frame.
      Palette: soft gold + amethyst/magenta + electric cyan beams on charcoal void —
      stained-glass neon spectrum, not grey monochrome. Mood: transmission, awe.
      Quality: monumental scale, clean geometry, rich glass caustics.
    prompt_seed: >
      Wide 16:9 ultra-premium cinematic CGI, colossal digital signal cathedral interior,
      soaring engineered beams and parabolic dish geometry, volumetric soft-gold cyan and
      magenta-amethyst light through signal-glass panels, cool white beams with acid-green
      edge sparks, charcoal void depths, monumental scale, sharp architectural detail,
      finished VFX still, full-bleed horizontal — luminous color spectrum, no people

  rootkit-city:
    label: Rootkit City
    hashtag: RootkitCity
    lane: gpu
    description: Dense digital city inside the hacker's computer — GPU-die towers, CPU cores, data racks packing the frame.
    art_director_notes: >
      GPU / NVIDIA / silicon / CPU / datacenter story as metaphor. Franchise: INSIDE THE
      HACKER'S COMPUTER rendered as a DENSE DIGITAL METROPOLIS — the city IS the silicon.
      Fill the frame with LOTS of buildings: circuit-board skyscrapers, GPU-die tower blocks,
      CPU core cubes, memory-bank mid-rises, rack-lit data towers, transistor districts.
      Streets = cyan PCB traces / orthogonal grid; facades carry square magenta nodes and
      etched circuitry. Density + legibility: packed skyline, layered depth, every tower
      reads as machine architecture. Rootkit = ARCHITECTURE (one green-lit tower, green
      window bands, or PCB right-angle etch on skins) — never a green path, trace, seam,
      beam, river, crack, or snaking ground line (those become neon lightning). Optional
      vertical matrix code-rain BETWEEN towers as atmosphere only, not ground weather.
      VARIETY = camera + district type (canyon, die plateau, rack district, CPU plaza,
      wafer stack, elevated mesh). ZERO people. Palette: void black + cyan + magenta +
      acid-green building/code accents + optional amber rack windows.
    prompt_seed: >
      Wide 16:9 landscape, dense digital city inside a hacker's mainframe — colossal GPU-die
      metropolis packed with silicon skyscrapers, CPU-core towers, and rack-lit data towers
      filling the frame, circuit-board streets as cyan PCB grid, magenta signal nodes on
      facades, acid-green as building lights and optional vertical matrix code-rain between
      towers, layered cinematic depth, neon night cyan magenta acid-green spectrum,
      Tron/Hackers/Matrix construct CGI, full-bleed horizontal — no people, no lightning
      bolts, no jagged glowing ground paths, no lava
