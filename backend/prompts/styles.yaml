# Planet Hack — digital series for @tunastarlink
# Cool-tech wire: SpaceX / GPU / AI model releases only.
# Visual DNA: neon-night matrix CGI — cyan / magenta / acid-green ON void black.
# Heaven filter is banned: no god-rays, no photoreal Earth postcards, no silver VFX.

series:
  name: Planet Hack
  tagline: Cool tech from the wire, remixed as neon matrix CGI — digital art from Starlink.
  # Kept for style metadata / UI; compose path leads with the art-director SHOT only.
  shared_lock: >
    Neon-night matrix CGI, wide 16:9. Void black. Saturated cyan, magenta, and
    acid-green are the color of the scene. Zero humans. No logos, flags, readable
    text, lightning, lava, or god-ray cathedral haze. No press photo with the neon
    stripped off. When the story names Starship, Falcon 9, or Starlink satellites,
    that object is the hero.

default: data-tunnel

styles:
  data-space:
    label: Data Space
    hashtag: DataSpace
    lane: space
    description: Cinematic neon space art — Starship, Falcon 9, or a Starlink satellite train.
    art_director_notes: >
      One object from the space pool, large in frame, the July 28 look: that real object
      flying past a planet wrapped in cyan-magenta data rings.
      Starship means the stainless-steel ship with its body flaps.
      Falcon 9 means the real first stage. White cylinder. Black interstage at the top.
      Four grid fins only on that interstage. Four landing legs only at the base.
      Nine Merlin engines in an octaweb, one center and eight around. No nose cone,
      no heat-shield tiles, no body flaps, no wings, no racing stripes on the white paint.
      Starlink means a short train of flat rectangular satellites, each with one long
      solar wing. Not a user dish. Never a generic ship, never the other object,
      never a stand-in.
      Camera is 3/4, low, or fly-by. NEVER a centered product-shot globe. NEVER a HUD.
      Real materials. On Falcon 9 the white paint stays white: cyan is rim light, not a
      stripe down the body. Volumetric magenta/green plume.
      Earth may look like Earth from orbit (oceans, night-side city lights) with neon
      telemetry OVER it — do not replace continents with a circuit board. Rings are
      luminous packet streams, not UI. Hero is NEVER a person. No crew windows with faces.
      No logos. Starfield + nebula depth. Color: void black + electric cyan + hot magenta + acid-green.
      BAN: Tron tube-outlines, glow-stick shuttle, HUD reticles, circuit-board globe,
      floating crystals, clipart Earth, god-rays, a press photo with the neon stripped off.
    prompt_seed: >
      Wide 16:9 cinematic CGI, 3/4 fly-by of the object named in the vehicle lock, large
      in frame, night-side Earth with city lights behind, thick cyan-magenta data rings
      wrapping the planet, volumetric magenta-green plume, starfield and nebula depth —
      that real object, not a generic ship, not Tron outlines, not a glow-stick shuttle,
      not a HUD globe, not a press photo, no people, no logos
    versions:
      deep-field:
        scene: >
          SCENE: deep space, not an Earth product shot. The hero object is mid-field against
          a dense starfield and a nebula shelf, a second planet small on the limb, one thin
          cyan ring far behind. Large enough to know which object it is. A Starlink train
          stays flat buses with solar wings, and it has no plume.
        art_director_notes: >
          Same franchise neon, different place: deep field. The named object sits against
          stars and a nebula, with a planet on the limb rather than filling the frame.
          One thin data ring, not the Earth-belt close-up. Obey the vehicle lock for the
          shape. Starlink satellites have no engines and no plume. No generic craft.
        prompt_seed: >
          Wide 16:9 cinematic CGI, the real named vehicle in deep space, large enough to
          recognize, dense starfield, nebula shelf, a planet only on the limb, one thin cyan
          data ring far behind, magenta-green plume, void black, neon light on real metal,
          not an Earth close-up, not a generic ship, no people, no logos
      limb-climb:
        scene: >
          SCENE: low angle, the hero object climbing along the bright limb of Earth, data
          rings edge-on as a thin ellipse. A rocket shows its plume downward. A Starlink
          train shows solar wings and no plume. The object fills the left third.
        art_director_notes: >
          Climbing shot. The named object rises along Earth's limb, rings edge-on. Obey
          the vehicle lock for the shape. A rocket's engines point toward the bottom of
          the frame. Starlink satellites have no engines and no plume. Cyan limb-light.
          Not a centered globe. Not a generic rocket.
        prompt_seed: >
          Wide 16:9 cinematic CGI, low angle of the real named vehicle climbing Earth's bright
          limb, hull on the left third, engines and magenta-green plume below, cyan-magenta
          data rings edge-on, city lights on the night side, recognizable ship, not a generic
          rocket, not a HUD, no people, no logos

  planet-core:
    label: Planet Core
    hashtag: PlanetCore
    lane: space
    description: Planetary mainframe — wireframe Earth jacked into a neon lattice.
    art_director_notes: >
      SpaceX / orbital / Starlink story as metaphor. INTERIOR of a planetary-scale
      computer core — a jacked wireframe data-Earth in a neon lattice of rings and
      conduits (the July 22 look), NEVER a washed photoreal globe in god-rays, NEVER
      a lone rock in empty space. Hero: neon wireframe Earth OR glowing root node.
      Density mid-high. Palette: electric cyan structure + magenta signal threads +
      acid-green root accents on void black — full neon spectrum.
      Mood: launch pressure, hacker climax. Camera: low-angle interior, wide 16:9.
      BAN: pale gold wash, church god-rays, silver CGI, empty void postcard.
    prompt_seed: >
      Wide 16:9 neon-night matrix CGI, interior of a planetary-scale computer core,
      cracked holographic wireframe Earth as the only hero (no people), layered neon
      data rings in cyan and magenta, acid-green root conduits, void black depths,
      sharp metal-glass grid, full-bleed horizontal — saturated neon night, not god-rays,
      not a washed globe, not empty space
    versions:
      matrix-earth:
        scene: >
          SCENE: outside the machine. A wireframe Earth hangs in a cage of orbital compute
          rings, seen from a gantry, not from inside a room. Matrix continents, neon conduits
          leaving the surface. No ship unless the story names one.
        art_director_notes: >
          Starlink or space news as the July orbital-compute look, from outside. A matrix
          Earth in a cage of cyan-magenta rings, gantries and conduit bundles at the frame
          edge. Not the interior nave. Not a photoreal globe. Not a rocket unless the wire
          names that vehicle. Density mid-high. Void black beyond the cage.
        prompt_seed: >
          Wide 16:9 neon CGI, a wireframe data-Earth seen from outside, caged in cyan and
          magenta orbital-compute rings, conduit bundles and a dark gantry at the frame edge,
          acid-green root nodes on the surface, void black beyond, not an interior room,
          not a washed globe, not god-rays, no people, no logos
      root-spike:
        scene: >
          SCENE: one cracked data-Earth and a single vertical root spike of acid-green light,
          layered cyan rings tight around the planet, lots of void. The spike is the hero.
        art_director_notes: >
          The quieter Planet Core: one cracked wireframe Earth, one root spike, layered rings.
          Not a busy interior, not a cathedral, not a ship. The spike is the only vertical.
          Cyan rings, magenta threads, acid-green spike, void black. Still neon, not a postcard.
        prompt_seed: >
          Wide 16:9 neon CGI, one cracked wireframe Earth in void black, a single acid-green
          root spike rising from it, tight layered cyan and magenta data rings, otherwise empty
          space, sharp and quiet, not an interior, not a ship, not god-rays, no people, no logos

  data-tunnel:
    label: Data Tunnel
    hashtag: DataTunnel
    lane: ai
    description: Speed tunnel — vanishing-point conduit packed with flowing neon data.
    art_director_notes: >
      AI / infrastructure story as metaphor. Strong tunnel axis, motion, far glow that is
      NEON not a white sun. PHYSICAL conduit: metal-glass ribs, then packed DATA IN MOTION
      (the July 24 look) — packet torrents, glyph dust, volumetric haze. Not a vector template.
      Palette: full neon spectrum — cyan, magenta, acid-green on void black.
      Camera: extreme FOV vanishing point, 16:9 full-bleed. No people.
      BAN: After Effects tunnel preset, Tron line-art, silver heaven corridor, white-hot sun, god-rays.
    prompt_seed: >
      Wide 16:9 cinematic CGI, high-speed cyberspace data tunnel with metal-glass conduit
      ribs, strong vanishing point, dense torrents of cyan magenta acid-green packets,
      volumetric haze, motion streaks, far neon bloom (not a white sun), kinetic depth,
      finished still — busy packed neon traffic, not a vector After Effects tunnel,
      no Tron outlines, no god-rays
    versions:
      pixel-run:
        scene: >
          SCENE: the original hacking-movie tunnel. Walls are columns of luminous pixels,
          extreme wide FOV, a planetary root-glow at the vanishing point. Motion streaks.
        art_director_notes: >
          AI story as the first Data Tunnel: a flythrough of pixel-column walls, not metal
          ribs. Extreme FOV, debris, cyan magenta acid-green, far root-glow that is neon.
          Not an After Effects preset, not a white sun, not a city.
        prompt_seed: >
          Wide 16:9 high-speed cyberspace tunnel, walls of luminous pixel columns, extreme
          FOV, motion streaks, voxel debris, far planetary root glow in cyan magenta and
          acid-green, dense, kinetic, not metal ribs, not a vector template, not a white
          sun, no people, no logos
      weight-stream:
        scene: >
          SCENE: a river of model-weight blocks rushing through a dark fiber trunk, camera
          low inside the flow, blocks as physical bricks of cyan and magenta light.
        art_director_notes: >
          AI weights as physical cargo. A dark fiber trunk, the camera inside a river of
          glowing bricks (the weights), acid-green sparks where bricks collide. Not a ribbed
          tunnel, not pixel wallpaper, not a vector preset. One direction, strong speed.
        prompt_seed: >
          Wide 16:9 cinematic CGI inside a dark fiber trunk, a river of physical glowing
          bricks rushing at the camera, cyan and magenta weight-blocks, acid-green sparks
          on collision, low camera in the flow, motion blur, void between the bricks, not a
          ribbed tunnel, not an After Effects preset, no people, no readable text

  signal-cathedral:
    label: Signal Cathedral
    hashtag: SignalCathedral
    lane: general
    description: Signal megastructure — RF cathedral of neon glass, not church light.
    art_director_notes: >
      Starlink / RF / space-comms story as metaphor. Colossal cathedral interior: soaring
      beams, dish geometry, stained-glass panels of PURE SIGNAL in cyan/magenta/green
      (no people in pews). Dense neon, not empty air. Vertical architecture in horizontal frame.
      Palette: electric cyan + magenta-amethyst + acid-green on charcoal/void —
      stained-glass NEON, not gold shafts through fog.
      BAN: volumetric god-ray church haze, empty nave, pale wash, photoreal stone.
    prompt_seed: >
      Wide 16:9 neon-night matrix CGI, colossal digital signal cathedral interior,
      soaring engineered beams and parabolic dish geometry, cyan magenta acid-green
      signal-glass panels (stained neon, not church windows), charcoal void depths,
      monumental scale, sharp architectural grid, full-bleed horizontal — luminous neon
      spectrum, no god-rays, no empty nave fog, no people
    versions:
      dish-tower:
        scene: >
          SCENE: exterior. One vertical megastructure of beams and pure-form radio dishes
          stacked up a tower, wide landscape, the tower off-center, void sky, no interior nave.
        art_director_notes: >
          The early Signal Cathedral, outside. A tower of parabolic dishes and engineered
          beams, off-center in a wide frame, cyan and magenta signal between the dishes,
          acid-green rim light. Not a church interior, not god-rays, not a rocket, not a city.
        prompt_seed: >
          Wide 16:9 neon CGI, exterior of one vertical tower built from parabolic dishes and
          engineered beams, off-center, cyan and magenta signal between the dishes, acid-green
          rim light, void black sky, monumental, not an interior nave, not church windows,
          not god-rays, no people, no logos
      array-hall:
        scene: >
          SCENE: a long hall of repeating dish-arches receding in one point, stained neon
          panels between the arches, floor is a dark grating, no pews, no fog shafts.
        art_director_notes: >
          A signal hall, not a church. Repeating dish-arches, stained neon panels of cyan
          magenta and acid-green, dark grating floor, one vanishing point. Dense structure,
          clear air. No god-rays, no stone, no people, no ship.
        prompt_seed: >
          Wide 16:9 neon CGI, a long hall of repeating parabolic dish-arches to one vanishing
          point, stained cyan magenta acid-green panels between the arches, dark metal grating
          floor, clear air, no fog shafts, no pews, no stone church, no people, no logos

  rootkit-city:
    label: Rootkit City
    hashtag: RootkitCity
    lane: gpu
    description: Luminous digital city inside the computer — neon-etched megastructure, not fogged glass in space.
    art_director_notes: >
      GPU / NVIDIA / silicon / CPU story as metaphor. Franchise: INSIDE THE COMPUTER as a
      luminous digital city — the city IS the silicon. ONE hero structure (canyon tower,
      GPU-die citadel, glass-silicon keep, wafer acropolis) on a PCB street grid.
      Facades are neon-etched — cyan streets, magenta nodes, acid-green as BUILDING LIGHT
      or vertical code-rain, never a ground path. ZERO people. NOT a packed server-rack
      farm. NOT a floating habitat in empty space. NOT fogged silver glass.
      Palette: void black + cyan + magenta + acid-green + optional amber window dots.
      BAN: god-rays, lots of night sky, orbital ring-city, washed teal fog.
    prompt_seed: >
      Wide 16:9 neon-night matrix CGI of a luminous digital city inside a computer —
      one impossible neon-etched megastructure of glass and silicon on a cyan PCB street
      grid, magenta nodes, optional vertical code-rain, acid-green building lights,
      void black sky, saturated cyan magenta green, no people, no packed server racks,
      no lightning, no god-rays, no floating orbital habitat
    versions:
      skyline:
        scene: >
          SCENE: a whole circuit skyline, many neon towers on a PCB street grid, no single
          citadel. Elevated view, unique roofline, cyan streets, magenta windows. Not racks.
        art_director_notes: >
          The classic circuit cityscape: a skyline of many towers, not one hero keep. PCB
          streets, neon-etched facades, acid-green as window light or code-rain. Elevated
          camera so the roofline varies. Not a server farm, not an infiltration bolt, not
          a habitat in space, not fog.
        prompt_seed: >
          Wide 16:9 neon CGI, a full circuit-board skyline of many different towers on a cyan
          PCB street grid, magenta windows, acid-green as building light, elevated night view,
          void black sky, varied roofline, not one lonely tower, not server racks, not
          lightning, no people, no logos
      die-city:
        scene: >
          SCENE: the frame is packed with GPU-die towers and CPU cores as architecture, wafer
          streets between them, one color of neon per district. Dense city, not a rack room.
        art_director_notes: >
          Dense silicon city from the packed-die days, without the server farm. GPU-die towers
          and CPU cores ARE the buildings, wafer avenues between them, the frame full. Cyan,
          magenta, and acid-green each own a district. Not racks, not one tower, not space.
        prompt_seed: >
          Wide 16:9 neon CGI, a dense city whose buildings are GPU dies and CPU cores, wafer
          avenues between them, frame full of silicon architecture, cyan district, magenta
          district, acid-green windows, void black above, not a server-rack room, not a single
